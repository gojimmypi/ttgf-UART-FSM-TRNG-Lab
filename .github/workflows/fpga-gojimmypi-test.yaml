# Test updates at: gojimmypi/tt-gds-action/fpga/ulx3s@063a4757e4301761587175f49827cb2f81939a27
# Instead of:      ulx3s/tt-gds-action/fpga/ulx3s@experimental

name: fpga-gojimmypi-test

# Manual regression test for gojimmypi/tt-gds-action.
# Does not run automatically on push or pull requests.
on:
  workflow_dispatch:

jobs:
  fpga:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: FPGA bitstream for TT ASIC Sim (ICE40UP5K)
        uses: TinyTapeout/tt-gds-action/fpga/ice40up5k@ttgf26a

  fpga-ulx3s-v20:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: FPGA bitstream for TT ASIC Sim (ULX3S ECP5  with v20 modified lpf)
        uses: gojimmypi/tt-gds-action/fpga/ulx3s@063a4757e4301761587175f49827cb2f81939a27
        with:
          ecp5-device: 85k

          # Override the support tools repository and branch.
          tools-repo: gojimmypi/tt-support-tools
          tools-ref: ulx3s # or tools-ref: experimental

          # LPF files come from tools-repo, checked out by the action into tt/.
          # See https://github.com/gojimmypi/tt-support-tools/tree/experimental/fpga/ulx3s
          lpf: tt/fpga/ulx3s/ulx3s_v20.lpf

          artifact-name: fpga_ulx3s_ecp5
          uart-enabled: false

  fpga-ulx3s-v20-50MHz:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: FPGA bitstream for TT ASIC Sim (ULX3S ECP5  with v20 modified lpf)
        uses: gojimmypi/tt-gds-action/fpga/ulx3s@063a4757e4301761587175f49827cb2f81939a27
        with:
          ecp5-device: 85k

          # Override the support tools repository and branch.
          tools-repo: gojimmypi/tt-support-tools
          tools-ref: ulx3s # or tools-ref: experimental

          # LPF files come from tools-repo, checked out by the action into tt/.
