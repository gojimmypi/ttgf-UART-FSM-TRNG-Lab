  fpga-ulx3s-vNone:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: FPGA bitstream for TT ASIC Sim (ULX3S ECP5 with non-existent lpf)
        id: missing-lpf
        continue-on-error: true
        uses: gojimmypi/tt-gds-action/fpga/ulx3s@063a4757e4301761587175f49827cb2f81939a27
        with:
          ecp5-device: 85k
          # LPF files come from the tt-support-tools repo, checked out by the action into tt/.
          # See https://github.com/ulx3s/tt-support-tools/tree/experimental/fpga/ulx3s
          lpf: tt/fpga/ulx3s/ulx3s_vnone.lpf
          artifact-name: fpga_ulx3s_ecp5

      - name: Verify missing LPF fails as expected
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.missing-lpf.outcome }}" != "failure" ]; then
              echo "::error::Expected the missing-LPF build to fail, but outcome was '${{ steps.missing-lpf.outcome }}'."
              exit 1
          fi
          echo "PASS: missing LPF correctly caused the FPGA build to fail."
