  # Verify that the action honors an explicitly selected older OSS CAD Suite release.
  fpga-ulx3s-v316-85k-oss-override:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: FPGA bitstream (ULX3S 85K, OSS CAD Suite 2026-04-26 override)
        uses: gojimmypi/tt-gds-action/fpga/ulx3s@063a4757e4301761587175f49827cb2f81939a27
        with:
          ecp5-device: 85k
          tools-repo: gojimmypi/tt-support-tools
          tools-ref: ulx3s # or tools-ref: experimental
          lpf: tt/fpga/ulx3s/ulx3s_v316.lpf
          oss-cad-suite-version: '2026-04-26'
          artifact-name: fpga_ulx3s_ecp5_v316_oss_20260426

  # Latest release as of 2026-10-14. Update the date deliberately for future tests.
  fpga-ulx3s-v316-85k-oss-latest:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: FPGA bitstream (ULX3S 85K, OSS CAD Suite 2026-10-14)
        uses: gojimmypi/tt-gds-action/fpga/ulx3s@063a4757e4301761587175f49827cb2f81939a27
        with:
