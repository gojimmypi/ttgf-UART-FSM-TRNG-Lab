          lpf: tt/fpga/ulx3s/ulx3s_v20_gn12_50mhz.lpf

          artifact-name: fpga_ulx3s_ecp5
          uart-enabled: false

  fpga-ulx3s-v314:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
