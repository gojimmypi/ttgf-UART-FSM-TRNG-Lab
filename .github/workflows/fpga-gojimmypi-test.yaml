          tools-ref: ulx3s # or tools-ref: experimental

          # LPF files come from tools-repo, checked out by the action into tt/.
          # See https://github.com/gojimmypi/tt-support-tools/tree/experimental/fpga/ulx3s

          lpf: tt/fpga/ulx3s/ulx3s_v314.lpf
          artifact-name: fpga_ulx3s_ecp5
