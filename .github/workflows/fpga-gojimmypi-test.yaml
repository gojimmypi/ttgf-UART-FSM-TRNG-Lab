          oss-cad-suite-version: '2026-10-14'
          artifact-name: fpga_ulx3s_ecp5_v316_oss_20261014

  fpga-ulx3s-marketplace-v003:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Tiny Tapeout GDS Action for the ULX3S and ULX4M ECP5 FPGA
        # see https://github.com/marketplace/actions/tiny-tapeout-gds-action-for-the-ulx3s-and-ulx4m-ecp5-fpga
        uses: ulx3s/tt-gds-action@v0.0.3
        # uses: ulx3s/tt-gds-action@experimental
        with:
          ecp5-device: 85k
          # LPF files come from the tt-support-tools repo, checked out by the action into tt/.
          # See https://github.com/ulx3s/tt-support-tools/tree/experimental/fpga/ulx3s
          lpf: tt/fpga/ulx3s/ulx3s_v316.lpf
          artifact-name: fpga_ulx3s_ecp5_marketplace

  fpga-ulx3s-marketplace-experimental:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Tiny Tapeout GDS Action for the ULX3S and ULX4M ECP5 FPGA
        # see https://github.com/marketplace/actions/tiny-tapeout-gds-action-for-the-ulx3s-and-ulx4m-ecp5-fpga
